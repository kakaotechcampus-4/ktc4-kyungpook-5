# 로컬 개발용. Python·uv·Node 설치 없이 FE·BE 를 함께 띄운다 (이슈 #35).
# PostgreSQL 은 db 서비스로 함께 띄운다 (이슈 #63).

services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: unyounghae
      POSTGRES_PASSWORD: unyounghae
      POSTGRES_DB: unyounghae
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./be/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unyounghae -d unyounghae"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./be
    ports:
      - "8000:8000"
    volumes:
      - ./be/app:/app/app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_URL: postgresql+psycopg://unyounghae:unyounghae@db:5432/unyounghae
    depends_on:
      db:
        condition: service_healthy

  web:
    # Tailwind 4 의 네이티브 의존성이 alpine(musl)에서 문제를 일으켜 일반 리눅스 이미지를 쓴다.
    image: node:22-bookworm-slim
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./fe:/app
      # node_modules 는 컨테이너에서 설치한 것을 쓴다.
      # 호스트(Windows)에서 설치된 바이너리는 리눅스에서 실행되지 않는다.
      - fe_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      
      VITE_USE_POLLING: "true"
    # --host 0.0.0.0: Vite 기본값은 localhost 바인딩이라 컨테이너 밖에서 접속되지 않는다.
    command: sh -c "[ -d node_modules/.bin ] || npm ci; npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  db_data:
  fe_node_modules:
