<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영해 v3 프로토타입</title>
<style>
:root{
  --bg:#f7f7f7; --card:#fff; --line:#e6e6e6; --line2:#efefef;
  --ink:#1a1a1a; --ink2:#6b6b6b; --ink3:#9a9a9a; --dark:#262626;
  --ai-bg:#eef3fc; --ai-line:#c9d9f2; --ai:#3f6fcb;
  --ap-bg:#fdf6ea; --ap-line:#ebd9ae; --ap:#d9a02b;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* ── chrome ───────────────────────────────── */
.topbar{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.ph{background:#dcdcdc;border-radius:6px;flex:none}
.ph.dot{border-radius:50%}
.navnote{margin-left:auto;font-size:11px;color:var(--ink3);background:#f2f2f2;border-radius:8px;padding:6px 12px}
.shell{display:flex;min-height:calc(100vh - 62px)}
.sidebar{width:228px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 12px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:var(--ink2);font-size:13px;text-align:left}
.navitem .ph{width:14px;height:14px}
.navitem:hover{background:#f4f4f4}
.navitem.on{background:var(--dark);color:#fff;font-weight:600}
.navitem.on .ph{background:#fff}
.content{flex:1;min-width:0;padding:32px;display:flex;flex-direction:column;gap:20px}
body.auth .sidebar,body.auth .navnote{display:none}
body.auth .content{align-items:center;padding:56px 32px}

/* ── primitives ───────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.pad{padding:20px 22px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
h1{font-size:26px;margin:0;letter-spacing:-.3px}
h2{font-size:17px;margin:0}
h3{font-size:14px;margin:0}
.sub{font-size:13px;color:var(--ink2);margin:4px 0 0}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.xs{font-size:11px}
.sm{font-size:12px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.divide{height:1px;background:var(--line2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--ink2);background:#fff;white-space:nowrap}
.chip.solid{background:#f1f1f1;border-color:#f1f1f1}
.chip.ai{background:var(--ai-bg);border-color:var(--ai-line);color:#2c5aad}
.chip.ap{background:var(--ap-bg);border-color:var(--ap-line);color:#9c6c11}
.tag{display:inline-flex;justify-content:center;min-width:52px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11px;color:var(--ink2);background:#fafafa}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;white-space:nowrap}
.btn:hover{background:#fafafa}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.dark:hover{background:#000}
.btn.pill{border-radius:999px}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.wide{width:100%;justify-content:center;padding:13px}
.link{font-size:12px;color:var(--ink2)}
.link:hover{color:var(--ink);text-decoration:underline}
.bar{height:8px;border-radius:999px;background:#ededed;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--dark);border-radius:999px}
.note{background:#fafafa;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--ink2);line-height:1.6}
.facts{margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.facts li{padding:2px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field label{display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:6px}
.req{color:#c0392b;font-size:10px}
.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:13px;background:#fff}
.input::placeholder{color:var(--ink3)}
.toggle{width:38px;height:22px;border-radius:999px;background:#dcdcdc;position:relative;flex:none}
.toggle.on{background:var(--dark)}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on:after{left:19px}
.crumb{font-size:12px;color:var(--ink2);margin-bottom:8px;display:inline-block}
.crumb:hover{color:var(--ink)}

/* ── approval list ────────────────────────── */
.aprow{display:flex;align-items:center;gap:14px;padding:14px 18px}
.aprow+.aprow{border-top:1px solid var(--line2)}
.aprow .grow{flex:1;min-width:0}
.aprow .t{font-size:13px;font-weight:600}
.aprow .s{font-size:12px;color:var(--ink2);margin-top:2px}
.apbox{border:1px solid var(--line);border-radius:14px;background:#fff}
.apbox>.head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
.gone{display:none}

/* ── steps rail ───────────────────────────── */
.rail{display:flex;gap:8px}
.rail>div{flex:1;min-width:0}
.rail .seg{height:6px;border-radius:3px;background:#ededed}
.rail .seg.done{background:var(--dark)}
.rail .seg.ai{background:var(--ai)}
.rail .seg.ap{background:var(--ap)}
.rail .seg.now{background:#111}
.rail .lb{font-size:10px;color:var(--ink3);margin-top:7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .lb.on{color:var(--ink);font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;padding-top:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#dcdcdc}
.dots i.on{background:var(--ink2)}

/* ── budget chart ─────────────────────────── */
.chart{display:flex;align-items:flex-end;gap:14px;height:190px}
.chart>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.chart .v{font-size:11px;color:var(--ink2)}
.chart .b{width:100%;border-radius:8px;background:#3a3a3a}
.chart .b.est{background:#f3f3f3;border:1px dashed #c8c8c8}
.chart .d{font-size:11px}
.chart .n{font-size:10px;color:var(--ink3)}
.flow{display:flex;gap:10px;font-size:12px;padding:5px 0}
.flow .dt{width:44px;color:var(--ink3);flex:none}
.flow .amt{margin-left:auto;font-variant-numeric:tabular-nums}

/* ── wizard ───────────────────────────────── */
.wiz{display:flex;align-items:center;gap:6px}
.wiz .st{flex:1;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px}
.wiz .st.on{background:var(--dark);border-color:var(--dark);color:#fff}
.wiz .num{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;color:var(--ink2)}
.wiz .st.on .num{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.wiz .st.ok .num{background:var(--dark);border-color:var(--dark);color:#fff}
.wiz .tt{font-size:13px;font-weight:600}
.wiz .ss{font-size:11px;opacity:.7}
.wiz .arrow{color:var(--ink3);flex:none}

/* ── chat ─────────────────────────────────── */
.msg{display:flex;gap:12px;margin-bottom:16px}
.msg .av{width:26px;height:26px;border-radius:8px;background:var(--dark);flex:none}
.bub{background:#f4f4f4;border-radius:14px;padding:13px 16px;max-width:640px;font-size:13px;line-height:1.6}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--dark);color:#fff;max-width:520px}
.qr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.recall{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:12px}
.recall .r{display:flex;gap:10px;padding:3px 0;align-items:center}
.recall .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recall .r span:first-child{color:var(--ink2);width:70px;flex:none}
.composer{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.composer input{flex:1;border:0;outline:0;font:inherit;font-size:13px}
.composer input::placeholder{color:var(--ink3)}

/* ── plan blocks (P2) ─────────────────────── */
.groups{display:grid;grid-template-columns:1fr 1fr 1fr 240px;gap:16px;align-items:start}
.group{background:#fafafa;border:1px solid var(--line);border-radius:14px;padding:16px}
.blocks{display:flex;flex-direction:column;gap:10px;margin-top:12px;min-height:60px}
.block{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab}
.block.ai{background:var(--ai-bg);border-color:var(--ai-line)}
.block.ap{background:var(--ap-bg);border-color:var(--ap-line)}
.block.drag{opacity:.35}
.block .gr{color:var(--ink3);font-size:11px;letter-spacing:-2px;flex:none;padding-top:2px}
.block .n{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.block.ai .n{background:var(--ai);border-color:var(--ai);color:#fff}
.block.ap .n{background:var(--ap);border-color:var(--ap);color:#fff}
.block .bt{font-size:13px;font-weight:600}
.block .bs{font-size:11px;color:var(--ink2);margin-top:2px}
.dropzone{border:1px dashed #cfcfcf;border-radius:12px;padding:11px;text-align:center;font-size:11px;color:var(--ink3)}
.dropzone.hot{border-color:var(--ink2);background:#f0f0f0;color:var(--ink)}
.legend{display:flex;gap:14px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2)}
.legend i{width:7px;height:7px;border-radius:50%;background:#dcdcdc}
.legend i.ai{background:var(--ai)}
.legend i.ap{background:var(--ap)}
.legend i.self{border:1px solid #bbb;background:#fff}

/* ── timeline (P3) ────────────────────────── */
.tl{display:flex;flex-direction:column}
.tlrow{display:grid;grid-template-columns:78px 20px 1fr;gap:12px}
.tlrow .when{font-size:12px;color:var(--ink2);text-align:right;padding-top:10px;white-space:nowrap}
.tlaxis{display:flex;flex-direction:column;align-items:center}
.tlaxis .pt{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #c9c9c9;margin-top:13px;flex:none}
.tlaxis .pt.ai{background:var(--ai);border-color:var(--ai)}
.tlaxis .pt.ap{background:var(--ap);border-color:var(--ap)}
.tlaxis .ln{width:1px;flex:1;background:var(--line);min-height:10px}
.tlbody{padding:8px 0 14px}
.tlbody .ttl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.tlbody .why{background:#fafafa;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--ink2);margin-top:8px}

/* ── records + panel ──────────────────────── */
.filerow{display:flex;align-items:center;gap:12px;padding:11px 18px;font-size:13px}
.filerow+.filerow{border-top:1px solid var(--line2)}
.panel{width:300px;flex:none;background:#fff;border-left:1px solid var(--line);position:sticky;top:62px;height:calc(100vh - 62px);display:flex;flex-direction:column}
.panel .ph2{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.panel .body{flex:1;overflow:auto;padding:16px 18px}
.panel .foot{border-top:1px solid var(--line2);padding:12px 14px;display:flex;gap:10px;align-items:center}
.panel .bub{font-size:12px;padding:11px 13px;max-width:100%}
.panel .msg{gap:8px;margin-bottom:14px}
.panel .av{width:20px;height:20px;border-radius:6px}
.sug{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;background:#fff;margin-top:8px}
.sug:hover{background:#fafafa}

/* ── auth ─────────────────────────────────── */
.authcard{width:520px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px}
.oauth{display:flex;flex-direction:column;gap:10px}
.hr{display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px;margin:18px 0}
.hr:before,.hr:after{content:"";flex:1;height:1px;background:var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><i class="ph dot" style="width:20px;height:20px"></i>운영해</div>
  <div class="navnote">추후 네비게이션 영역</div>
</header>
<div class="shell">
  <aside class="sidebar" id="side"></aside>
  <main class="content" id="view"></main>
  <div id="panel"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ═════════ state ═════════ */
const NAV = [['main','메인'],['plan','행사 계획'],['events','행사 목록'],['records','동아리 기록'],['mypage','마이 페이지']];

const S = {
  route: 'login',
  evIdx: 0,
  planStep: 1,
  budgetEmpty: false,
  chatOpen: true,          // 기록 페이지 챗봇 패널 — 기본 열림(✕로 닫고 '물어보기'로 다시 열기)
  done: {},                 // 처리한 승인/확인 id
  planChat: [],             // P1 추가 대화
  panelChat: [],            // 기록 챗봇 추가 대화
  memberListDone: false,
  midCheckAdded: false,
  drag: null,
};

const EVENTS = [
  { id:'mt', name:'2026 봄 MT', stage:'수납 단계', badge:'진행 중', dday:'D-11', when:'3/21–3/22',
    head:'3/21 출발까지 11일',
    reason:'납부 마감이 이틀 남았는데 1차 안내 이후 사흘째 추가 입금이 없습니다. 계약금 납부일(3/14)이 명단 확정일(3/13)보다 하루 뒤라, 미납이 정리되지 않으면 인원 기준 없이 계약금을 넣게 됩니다.',
    stepNote:'9단계 중 4단계 · 예정보다 하루 늦음',
    steps:['과거 기록 참고','담당 배치','수요 조사','일정 확정','모집 공지','입금 확인','리허설','행사 진행','정산·기록'],
    doneN:6,
    approvals:[
      {id:'a1',tag:'외부 발송',t:'미납자 4명에게 2차 납부 안내 문자 보내기',s:'대상 4명 · 비용 0원 · 마감 D-2'},
      {id:'a2',tag:'이체',t:'펜션 계약금 100,000원 이체하고 예약 확정',s:'3/16부터 환불 불가 · 잔고 2,412,000원'},
      {id:'a3',tag:'지출',t:'장보기·버스 잔금 등 지출 4건 묶음 승인',s:'합계 182,000원 · 영수증 4건 확인됨'},
    ]},
  { id:'sem', name:'3월 정기 세미나', stage:'연사 섭외 단계', badge:'진행 중', dday:'D-17', when:'3/27',
    head:'3/27 개최까지 17일',
    reason:'연사 두 분 중 한 분만 확정됐습니다. 참석 신청이 14명으로 지난 세미나 대비 낮아, 확정 안내를 보내며 홍보를 한 번 더 도는 편이 좋습니다.',
    stepNote:'7단계 중 3단계 · 일정대로 진행 중',
    steps:['과거 기록 참고','주제 확정','연사 섭외','장소 예약','참석 모집','세미나 진행','정산·기록'],
    doneN:3,
    approvals:[
      {id:'b1',tag:'외부 발송',t:'연사 확정 안내 메일 발송',s:'대상 1명 · 외부 인사'},
    ]},
  { id:'new', name:'신입생 환영회', stage:'수요 조사 단계', badge:'진행 중', dday:'D-24', when:'4/3',
    head:'4/3 개최까지 24일',
    reason:'설문 응답이 41명으로 예상보다 많습니다. 장소 정원을 다시 확인하지 않으면 인원 초과가 생길 수 있습니다.',

    doneN:3,
    approvals:[
      {id:'c1',tag:'지출',t:'현수막 제작비 25,000원 집행',s:'예산 홍보 항목 내 · 외부 결제'},
    ]},
];

const FLOW = [
  ['3/12','회비 미납분 4명','확정','+180,000'],
  ['3/14','펜션 계약금','승인 대기','−100,000'],
  ['3/18','버스 잔금·식자재','예상','−342,000'],
  ['3/21','행사 당일 현장비','예상','−120,000'],
  ['3/24','정산·뒤풀이','예상','−100,000'],
];
const CHART = [['241만','3/10','오늘',241,1],['259만','3/12','회비 마감',259,1],['249만','3/14','계약금',249,0],
               ['215만','3/18','잔금 지급',215,0],['203만','3/21','행사',203,0],['193만','3/24','정산 끝',193,0]];

/* P2 / P3 단계 블록 — 하나의 배열이 두 화면의 근거 */
let BLOCKS = [
  {g:0,t:'과거 기록 참고',s:'작년 정산·인스타·문서에서 인원·예산·장소 불러오기',k:'ai',d:'3/2'},
  {g:0,t:'담당 인원 배치',s:'분야별 담당자 지정',k:'self',d:'3/3'},
  {g:0,t:'가능 여부 확인',s:'장소·차량 전화 문의',k:'self',d:'3/4'},
  {g:0,t:'사전 수요 조사',s:'폼 생성은 자동 · 단톡방 발송은 승인',k:'ap',d:'3/5',
   why:'수요조사 폼을 만들어 단톡방에 올립니다. 폼 생성은 자동, 발송 직전 승인 한 번.',badge:'공지'},

/* ═════════ router ═════════ */
const SCREENS = {login, signup, main, events, event:eventDetail, records, mypage,
  plan: () => S.planStep===1 ? plan1() : S.planStep===2 ? plan2() : plan3()};
const NAVOF = {main:'main', plan:'plan', events:'events', event:'events', records:'records', mypage:'mypage'};

function render(){
  const auth = S.route==='login' || S.route==='signup';
  document.body.classList.toggle('auth', auth);
  $('#side').innerHTML = auth ? '' : NAV.map(([r,t])=>
    `<button class="navitem ${NAVOF[S.route]===r?'on':''}" data-act="go" data-to="${r==='plan'?'plan':r}">${ph(14,14,'dot')}${t}</button>`).join('');
  $('#view').innerHTML = SCREENS[S.route]();
  $('#panel').innerHTML = S.route==='records' ? panel() : '';
  if(S.route==='plan' && S.planStep===2) wireDrag();
}

/* ═════════ 액션 ═════════ */
const chatVal = sel => { const el=$(sel); const v=el&&el.value.trim(); if(el) el.value=''; return v; };
function planSay(q){
  S.planChat.push({who:'me',t:q});
  S.planChat.push({who:'ai',t:'“'+q+'” 반영했습니다. 오른쪽 요약을 확인하고 다음 단계로 넘어가세요.'});
  render();
  const c=$('#chat'); if(c) c.scrollTop = c.scrollHeight;
}
function askSay(q){
  S.panelChat.push({who:'me',t:q});
  S.panelChat.push({who:'ai',t: ANSWERS[q] || '그 내용은 올라온 기록에서 찾지 못했습니다. 관련 문서를 올려주시면 다시 답하겠습니다.'});
  S.chatOpen = true; render();
  const b=document.querySelector('.panel .body'); if(b) b.scrollTop = b.scrollHeight;
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  const A = {
    go:   () => go(el.dataset.to),
    ev:   () => { S.evIdx = (S.evIdx + +el.dataset.d + EVENTS.length) % EVENTS.length; render(); },
    opendetail: () => { S.evIdx = +el.dataset.i; go('event'); },
    ap:   () => { S.done[el.dataset.id]=1; toast('승인했습니다. 활동 기록에 남습니다.'); render(); },
    later:() => { S.done[el.dataset.id]=1; toast('나중에로 미뤘습니다.'); render(); },
    apall:() => { EVENTS[S.evIdx].approvals.forEach(x=>S.done[x.id]=1); toast('승인 대기를 한 번에 처리했습니다.'); render(); },
    apallall: () => { EVENTS.forEach(e=>e.approvals.forEach(x=>S.done[x.id]=1)); toast('전부 처리했습니다.'); render(); },
    check:() => { S.done[el.dataset.id]=1; toast('“'+el.dataset.v+'”로 처리했습니다.'); render(); },
    pstep:() => { S.planStep = +el.dataset.n; go('plan'); },
    newplan: () => { S.planStep = 1; S.planChat = []; go('plan'); },
    reset:() => { S.planChat = []; S.planStep = 1; toast('처음부터 다시 시작합니다.'); render(); },
    save: () => toast('임시 저장했습니다.'),
    more: () => planSay('조금 더 이야기하고 싶어요'),
    qr:   () => planSay(el.dataset.q),
    send: () => { const v = chatVal('[data-role="chatinput"]'); if(v) planSay(v); },
    midcheck: () => {
      if(S.midCheckAdded) return;
      const i = BLOCKS.findIndex(b=>b.t==='입금 내역 확인');
      BLOCKS.splice(i+1, 0, {g:1,t:'중간 점검',s:'인원 변동 반영 · 명단 재확인',k:'ai',d:'3/15',
        why:'입금 마감 이후 인원 변동을 반영해 예산과 명단을 다시 계산합니다.'});
      S.midCheckAdded = true; toast('3/15에 중간 점검 단계를 넣었습니다.'); render(); },
    startevent: () => { toast('행사를 시작했습니다. 행사 목록에 올라갔습니다.'); go('events'); },
    emptybudget: () => { S.budgetEmpty = true; render(); },
    fullbudget:  () => { S.budgetEmpty = false; render(); },
    openchat:  () => { const v = chatVal('[data-role="askinput"]'); if(v) askSay(v); else { S.chatOpen=true; render(); } },
    closechat: () => { S.chatOpen = false; render(); },
    ask:     () => askSay(el.dataset.q),
    asksend: () => { const v = chatVal('.panel [data-role="askinput"]'); if(v) askSay(v); },
    uploadmembers: () => { S.memberListDone = true; toast('회원 명단 32명을 불러왔습니다.'); render(); },
    tg:   () => el.classList.toggle('on'),
    pickchip: () => { el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('solid')); el.classList.add('solid'); },
    wip:  () => toast('와이어프레임 프로토타입 — 이 동작은 아직 없습니다.'),
  }[a];
  if(A){ ev.preventDefault(); A(); }
});

document.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter') return;
  const r = ev.target.dataset && ev.target.dataset.role;
  if(r === 'chatinput'){ const v = chatVal('[data-role="chatinput"]'); if(v) planSay(v); }
  if(r === 'askinput'){ const sel = ev.target.closest('.panel') ? '.panel [data-role="askinput"]' : '[data-role="askinput"]';
    const v = chatVal(sel); if(v) askSay(v); }
});

/* ═════════ P2 블록 끌어 옮기기 ═════════ */
function wireDrag(){
  document.querySelectorAll('.block').forEach(b => {
    b.addEventListener('dragstart', e => { S.drag = +b.dataset.n; b.classList.add('drag'); e.dataTransfer.effectAllowed='move'; });
    b.addEventListener('dragend',   () => b.classList.remove('drag'));
    b.addEventListener('dragover',  e => e.preventDefault());
    b.addEventListener('drop',      e => { e.preventDefault(); e.stopPropagation(); dropAt(+b.dataset.n); });
  });
  document.querySelectorAll('.dropzone').forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('hot'); });
    z.addEventListener('dragleave',() => z.classList.remove('hot'));
    z.addEventListener('drop',     e => { e.preventDefault(); dropEnd(+z.dataset.g); });
  });
}
const regroup = () => { BLOCKS = BLOCKS.slice().sort((a,b)=>a.g-b.g); };  // sort는 안정적 — 묶음 안 순서 유지
function dropAt(targetN){
  const from = S.drag - 1, to = targetN - 1;
  if(S.drag == null || from === to) return;
  const item = BLOCKS[from], g = BLOCKS[to].g;
  BLOCKS.splice(from, 1);
  item.g = g;
  BLOCKS.splice(from < to ? to - 1 : to, 0, item);
  regroup(); S.drag = null; render();
}
function dropEnd(g){
  const from = S.drag - 1;
  if(S.drag == null) return;
  const [item] = BLOCKS.splice(from, 1);
  item.g = g;
  let last = -1; BLOCKS.forEach((b,i)=>{ if(b.g===g) last=i; });
  BLOCKS.splice(last + 1, 0, item);
  regroup(); S.drag = null; render();
}

render();
</script>
