name: Build and deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - name: Check frontend
        working-directory: fe
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Test backend
        working-directory: be
        run: uv run --locked pytest -q

  publish:
    needs: verify
    if: github.ref == 'refs/heads/develop' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "backend_image=$REGISTRY/unyounghae-api:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend_image=$REGISTRY/unyounghae-web:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: be
          file: be/Dockerfile.prod
          push: true
          tags: ${{ steps.images.outputs.backend_image }}
      - uses: docker/build-push-action@v6
        with:
          context: fe
          file: fe/Dockerfile.prod
          push: true
          tags: ${{ steps.images.outputs.frontend_image }}

  deploy:
    needs: publish
    if: vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ktc-github-deploy
          aws-region: ap-northeast-2
      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          site_address=${SITE_ADDRESS:-:80}
          [[ "$site_address" =~ ^(:80|[A-Za-z0-9.-]+)$ ]]
          compose_b64=$(base64 -w 0 deploy/compose.yml)
          script_b64=$(base64 -w 0 deploy/remote-deploy.sh)
          command_text="set -eu
          install -d /opt/unyounghae
          printf %s '$compose_b64' | base64 -d > /opt/unyounghae/compose.yml
          printf %s '$script_b64' | base64 -d > /opt/unyounghae/remote-deploy.sh
          AWS_REGION=ap-northeast-2 BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' SITE_ADDRESS='$site_address' bash /opt/unyounghae/remote-deploy.sh"
          jq -n --arg command "$command_text" '{commands: [$command]}' > "$RUNNER_TEMP/ssm-parameters.json"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)
          for attempt in {1..60}; do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Error:StandardErrorContent}' --output json
                exit 1 ;;
            esac
            sleep 5
          done
          echo 'Timed out waiting for Systems Manager deployment' >&2
          exit 1
