name: "✨ 기능 개발"
description: "새로 만들 기능 하나를 작업 단위로 등록합니다."
title: "Feat: "
labels: ["type: feat"]
body:
  - type: markdown
    attributes:
      value: |
        이슈 1개 = PR 1개가 되도록 쪼개주세요. 하루 안에 끝나지 않을 크기면 나눠서 올리는 게 좋습니다.
        제목의 `Feat: ` 뒤에만 이어서 쓰면 커밋·PR 제목이 그대로 결정됩니다.

  - type: dropdown
    id: area
    attributes:
      label: 파트
      description: "고른 값에 맞는 `area:` 라벨도 함께 붙여주세요."
      options:
        - AI
        - BE
        - FE
        - common (CI · 템플릿 · 루트 문서)
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 기능 요약
      description: "무엇을 만드는지 2~3줄. 왜 필요한지가 들어가면 좋습니다."
      placeholder: "행사 참가자가 QR 로 입장 체크인할 수 있게 한다. 현장에서 명단을 눈으로 찾는 시간을 줄이는 게 목적."
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 작업 내용
      description: "체크리스트로 적으면 진행 상황이 이슈에서 바로 보입니다."
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: "무엇이 되면 이 이슈를 닫을 수 있는지. 리뷰어와 작성자의 기준을 맞추는 항목입니다."
      placeholder: |
        - QR 스캔 시 참가자 이름과 체크인 시각이 응답에 포함된다
        - 이미 체크인한 참가자는 409 로 거절된다
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 참고 자료 · 관련 이슈
      description: "API 명세, 와이어프레임, 선행 이슈(#번호), 참고 링크 등."
    validations:
      required: false
